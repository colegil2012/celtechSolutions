spring:
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: celtech-solutions

app:
  cors:
    # Empty fallback intentional — same-origin deploy, no cross-origin requests.
    allowed-origins: ${CORS_ORIGINS:https://ddarty.com,https://www.ddarty.com,https://ells4u.com,https://www.ells4u.com,http://localhost:5173}
  auth:
    cookie-secure: true
  mail:
    enabled: true

logging:
  level:
    com.celtech.api: INFO
    org.mongodb.driver: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
